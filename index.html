    <style>
          .logo-upn-container {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 2000;
            background: white;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.4);
          }
          .logo-upn-container img {
            height: 70px;
            width: auto;
            display: block;
          }
          .logo-upn-container:hover {
            box-shadow: 0 5px 15px rgba(0,0,0,0.6);
            transform: scale(1.05);
            transition: all 0.3s ease;
          }
        </style>
